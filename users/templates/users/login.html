{% extends 'mailing/base.html' %}

{% block title %}Вход на сайт{% endblock %}

{% block content %}
<div style="max-width: 450px; margin: 50px auto;" class="card">
    <div style="background-color: #212529; color: #fff; padding: 15px; font-weight: bold; font-size: 1.1rem;">
        🔒 Вход в личный кабинет
    </div>
    <div style="padding: 20px;">
        <form method="post">
            {% csrf_token %}

            {% for field in form %}
                <div style="margin-bottom: 15px;">
                    <label style="display: block; margin-bottom: 5px; font-weight: 600;">{{ field.label }}</label>
                    <input type="{{ field.field.widget.input_type }}" name="{{ field.html_name }}" class="form-control" style="width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ced4af; border-radius: 4px;" required>
                    {% if field.errors %}
                        <div style="color: #dc3545; font-size: 0.85rem; mt-1;">{{ field.errors|striptags }}</div>
                    {% endif %}
                </div>
            {% endfor %}

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 10px; margin-top: 10px;">Войти</button>
        </form>

        <div style="text-align: center; margin-top: 15px;" class="text-muted small">
            Ещё нет аккаунта? <a href="{% url 'users:register' %}" style="color: #0d6efd; text-decoration: none;">Зарегистрироваться</a>
        </div>
    </div>
</div>
{% endblock %}
